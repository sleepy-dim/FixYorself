name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts was not found anywhere in this repo. Files in repo:"
            find . -not -path './.git/*' -type f | head -n 60
            exit 1
          fi
          d=$(dirname "$f")
          echo "Project folder: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build (release + debug)
        id: build
        continue-on-error: true
        shell: bash
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleRelease assembleDebug --no-daemon --continue 2>&1 | tee build.log

      - name: Summary
        if: always()
        shell: bash
        run: |
          D="${{ steps.loc.outputs.dir }}/app/build/outputs/apk"
          echo "### LifeLock build result" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$D/release/app-release.apk" ]; then echo "- ✅ Release APK built (install this one)" >> "$GITHUB_STEP_SUMMARY"; else echo "- ❌ Release APK NOT built" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$D/debug/app-debug.apk" ]; then echo "- ✅ Debug APK built" >> "$GITHUB_STEP_SUMMARY"; else echo "- ❌ Debug APK NOT built (the code has an error: open build.log)" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "First error lines:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -m 12 -E "^e: |error:|FAILED|What went wrong" "${{ steps.loc.outputs.dir }}/build.log" >> "$GITHUB_STEP_SUMMARY" || echo "none" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LifeLock-apk
          if-no-files-found: warn
          path: |
            ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/release/app-release.apk
            ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.loc.outputs.dir }}/build.log
